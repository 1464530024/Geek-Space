[package]
name = "geek-space"
version = "0.3.0"
description = "Geek Space - 设备信息与硬件监控工作台"
authors = ["Geek Space"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "geek_space_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_System_Ole",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
incremental = false
